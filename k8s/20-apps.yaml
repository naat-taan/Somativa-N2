apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: somativa-n2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/somativa-inventory:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: somativa-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: somativa-n2
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: somativa-n2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/somativa-orders:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: somativa-config
            - secretRef:
                name: somativa-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: somativa-n2
spec:
  selector:
    app: orders-service
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-worker
  namespace: somativa-n2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfillment-worker
  template:
    metadata:
      labels:
        app: fulfillment-worker
    spec:
      containers:
        - name: fulfillment
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/somativa-fulfillment:latest
          envFrom:
            - secretRef:
                name: somativa-secrets