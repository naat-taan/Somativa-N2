apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: somativa-ingress
  namespace: somativa-n2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  number: 3000
          - path: /api/inventory
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8000